# Canonical GED/IG algorithm selection.
#
# ged_algorithm accepts: simple, advanced, networkx, hybrid
# ig_algorithm accepts: simple, advanced, entropy, hybrid
# Override these two fields at load time to compare combinations.

environment: experiment
pre_warm_models: false

llm:
  provider: mock
  model: mock

embedding:
  model_name: sentence-transformers/all-MiniLM-L6-v2
  dimension: 384
  device: cpu

memory:
  max_retrieved_docs: 15
  episodic_memory_capacity: 60

graph:
  ged_algorithm: advanced
  ig_algorithm: advanced
  spike_ged_threshold: -0.5
  spike_ig_threshold: 0.3
  similarity_threshold: 0.35
  optimal_graph_size: 100
  weight_ged: 0.5
  weight_ig: 0.5
  temperature: 1.0

metrics:
  use_normalized_ged: true
  use_entropy_variance_ig: false
  use_multihop_gedig: false
  query_centric: true
  query_topk_centers: 3
  query_radius: 1

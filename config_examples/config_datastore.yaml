# SQLite-backed configuration for durable episode storage.

environment: development
pre_warm_models: false

llm:
  provider: mock
  model: mock
  temperature: 0.7
  max_tokens: 500

embedding:
  model_name: sentence-transformers/all-MiniLM-L6-v2
  dimension: 768
  device: cpu

datastore:
  type: sqlite
  db_path: ./data/insight.db
  vector_dim: 768

memory:
  max_episodes: 10000
  cache_size: 100
  max_retrieved_docs: 20
  search_k: 20

graph:
  similarity_threshold: 0.7
  enable_graph_search: true
  hop_limit: 2
  neighbor_threshold: 0.7
  path_decay: 0.8

performance:
  enable_cache: true
  parallel_workers: 4

monitoring:
  enabled: true
  performance_tracking: true

logging:
  level: INFO
  file_path: ./logs/insightspike.log
  log_to_console: true

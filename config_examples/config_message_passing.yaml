# Question-aware graph message passing and post-propagation edge evaluation.

environment: experiment
pre_warm_models: false

llm:
  provider: mock
  model: mock
  max_context_docs: 5
  use_simple_prompt: false

embedding:
  model_name: sentence-transformers/all-MiniLM-L6-v2
  dimension: 384
  device: cpu

memory:
  max_episodes: 5000
  max_retrieved_docs: 15

processing:
  enable_insight_search: true
  max_insights_per_query: 5

graph:
  enable_message_passing: true
  message_passing:
    alpha: 0.3
    iterations: 3
    max_hops: 2
    # weighted_mean | mean | max
    # "attention" is a deprecated compatibility alias for mean.
    aggregation: weighted_mean
    self_loop_weight: 0.5
    decay_factor: 0.8
    similarity_threshold: 0.3
    convergence_threshold: 0.0001
    enable_batch_computation: true
    cache_similarities: true
    top_k_relevance_percentile: 75
  edge_reevaluation:
    similarity_threshold: 0.7
    new_edge_threshold: 0.8
    max_new_edges_per_node: 5
    edge_decay_factor: 0.9
  similarity_threshold: 0.6
  spike_ged_threshold: -0.3
  spike_ig_threshold: 0.7
  conflict_threshold: 0.5
  enable_graph_search: true
  use_gnn: false
  ged_algorithm: advanced
  ig_algorithm: advanced

logging:
  level: INFO
  log_to_console: true

# Advanced GED/IG with normalized metrics.

environment: development
pre_warm_models: false

llm:
  provider: mock
  model: mock

embedding:
  model_name: sentence-transformers/all-MiniLM-L6-v2
  dimension: 384
  device: cpu

datastore:
  type: filesystem
  root_path: ./data/insight_store

memory:
  max_retrieved_docs: 10
  short_term_capacity: 10
  working_memory_capacity: 20
  episodic_memory_capacity: 60
  pattern_cache_capacity: 15

graph:
  spike_ged_threshold: -0.5
  spike_ig_threshold: 0.2
  similarity_threshold: 0.3
  conflict_threshold: 0.5
  use_gnn: false
  gnn_hidden_dim: 64
  ged_algorithm: advanced
  ig_algorithm: advanced
  enable_message_passing: false
  hybrid_weights:
    structure: 0.4
    semantic: 0.4
    quality: 0.2

reasoning:
  max_cycles: 10
  convergence_threshold: 0.8
  spike_threshold: 0.7

processing:
  max_cycles: 10
  convergence_threshold: 0.8
  min_quality_threshold: 0.7
  use_advanced_metrics: true

metrics:
  use_normalized_ged: true
  use_entropy_variance_ig: false
  use_multihop_gedig: false
  spectral_evaluation:
    enabled: false
    weight: 0.3

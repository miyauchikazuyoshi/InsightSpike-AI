# OpenAI provider with a local embedding model.
# Set OPENAI_API_KEY in the process environment before making API calls.

environment: production
pre_warm_models: false

llm:
  provider: openai
  model: gpt-3.5-turbo
  temperature: 0.7
  max_tokens: 1000
  timeout: 30
  prompt_style: standard

embedding:
  model_name: sentence-transformers/all-MiniLM-L6-v2
  dimension: 384
  device: cpu

memory:
  max_episodes: 10000
  max_retrieved_docs: 20
  search_k: 20

graph:
  similarity_threshold: 0.3
  spike_ged_threshold: -0.5
  spike_ig_threshold: 0.2
  ged_algorithm: advanced
  ig_algorithm: advanced

datastore:
  type: filesystem
  root_path: ./data/openai_store

logging:
  level: INFO
  log_to_console: true

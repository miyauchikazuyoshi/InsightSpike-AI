# Larger capacities and optional optimizations for local experiments.

environment: experiment
pre_warm_models: false

llm:
  provider: mock
  model: mock
  temperature: 0.3
  max_tokens: 256
  top_p: 0.9
  prompt_style: standard
  max_context_docs: 5
  use_simple_prompt: false
  include_metadata: false

embedding:
  model_name: sentence-transformers/all-MiniLM-L6-v2
  dimension: 384
  device: cpu

memory:
  max_retrieved_docs: 15
  short_term_capacity: 20
  working_memory_capacity: 50
  episodic_memory_capacity: 100
  pattern_cache_capacity: 30
  max_episodes: 5000
  cache_size: 200
  faiss_index_type: IVF
  metric: l2
  use_graph_integration: true
  batch_size: 32
  cache_embeddings: true

processing:
  enable_insight_registration: true
  enable_insight_search: true
  max_insights_per_query: 5
  enable_layer1_bypass: true
  bypass_uncertainty_threshold: 0.2
  bypass_known_ratio_threshold: 0.9
  dynamic_doc_adjustment: true
  max_docs_with_insights: 5
  insight_relevance_boost: 0.2
  enable_learning: true
  learning_rate: 0.1
  exploration_rate: 0.15
  batch_size: 32
  max_workers: 4

graph:
  spike_ged_threshold: -0.5
  spike_ig_threshold: 0.2
  conflict_threshold: 0.5
  similarity_threshold: 0.35
  use_gnn: false
  hop_limit: 2
  neighbor_threshold: 0.35
  path_decay: 0.7
  enable_graph_search: true
  ged_algorithm: advanced
  ig_algorithm: advanced
  sp_engine: cached

metrics:
  use_normalized_ged: true
  query_centric: true
  query_topk_centers: 3
  query_radius: 1

vector_search:
  backend: auto
  optimize: true
  batch_size: 1000

performance:
  enable_cache: true
  parallel_workers: 4

monitoring:
  enabled: true
  performance_tracking: true
  detailed_tracing: false
  metrics_port: 8080

logging:
  level: INFO
  file_path: ./experiments/logs/experiment.log
  log_to_console: true
  max_size_mb: 10
  backup_count: 3

output:
  format: json
  include_reasoning: true
  include_sources: true
  max_sources: 5
  max_context_length: 2000

paths:
  data_dir: ./data
  cache_dir: ./cache
  logs_dir: ./logs
  models_dir: ./models

datastore:
  type: filesystem
  root_path: ./data/experiment_store

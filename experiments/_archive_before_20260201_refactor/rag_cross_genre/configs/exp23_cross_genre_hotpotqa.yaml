experiment:
  name: exp23_cross_genre_hotpotqa
  output_dir: experiments/rag_cross_genre/results
  seed: 42
  target_ag_rate: 0.08
  target_dg_rate: 0.04

dataset:
  path: experiments/rag_cross_genre/data/hotpotqa_cross_genre.jsonl
  max_queries: null

embedding:
  model: sentence-transformers/all-MiniLM-L6-v2
  normalize: true
  cache_dir: experiments/rag_cross_genre/cache

retrieval:
  top_k: 6
  bm25_weight: 0.5
  embedding_weight: 0.5
  expansion_hops: 1
  scope: per_query

gedig:
  lambda: 0.6
  use_multihop: true
  max_hops: 3
  decay_factor: 0.7
  sp_beta: 0.2
  theta_ag: 2.0
  theta_dg: 0.05
  ig_mode: raw
  spike_mode: and

psz:
  acceptance_threshold: 0.6
  fmr_threshold: 0.02
  latency_p50_threshold_ms: 200

baselines:
  - name: static_rag
    type: static
  - name: gedig_ag_dg
    type: gedig

logging:
  save_step_logs: false
  save_memory_snapshots: false
  snapshot_interval: 200

# MuSiQue Ablation — θ_dg fix only, NO Component Gap Query
# Purpose: Isolate threshold fix from gap query effect
# If Δβ₁ lift returns → gap query was destroying the signal
# If Δβ₁ lift stays dead → 100q signal was noise
condition_name: condition_musique_ablation_4o

data_path: data/musique_dev.jsonl

adapter:
  structural_mode: betti_full
  gamma_0: 0.3
  gamma_1: 0.5
  lambda_weight: 1.0
  theta_ag: 0.4
  theta_dg: -10.0
  max_hops: 2
  top_k: 5
  max_expansions: 1
  expansion_seeds: 2
  tfidf_dim: 64
  q_link_top_k: 3
  entity_overlap_threshold: 0.3
  llm_model: gpt-4o
  llm_temperature: 0.0
  llm_max_tokens: 256
  llm_retry_max: 3
  hybrid_mode: true
  max_cot_steps: 2
  two_edge_mode: true
  rerank_alpha: 0.5
  ctx_max_sent_distance: 6
  sim_alpha: 0.6
  sim_beta: 0.4
  sim_edge_threshold: 0.45
  # v8 DISABLED for ablation
  component_gap_query: false

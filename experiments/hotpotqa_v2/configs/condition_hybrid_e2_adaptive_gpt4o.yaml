# Condition Hybrid-E2 (GPT-4o): Adaptive Depth CoT (v4)
#
# Same as condition_hybrid_e2_adaptive.yaml but with GPT-4o
# for multi-model verification.
condition_name: condition_hybrid_e2_adaptive_gpt4o

data_path: data/hotpotqa_distractor_dev.jsonl

adapter:
  structural_mode: betti_full
  gamma_0: 0.3
  gamma_1: 0.5
  lambda_weight: 1.0
  theta_ag: 0.4
  theta_dg: -0.5
  max_hops: 2
  top_k: 5
  max_expansions: 1
  expansion_seeds: 2
  tfidf_dim: 64
  q_link_top_k: 3
  entity_overlap_threshold: 0.3
  llm_model: gpt-4o
  llm_temperature: 0.0
  llm_max_tokens: 256
  llm_retry_max: 3
  # v3 Hybrid mode
  hybrid_mode: true
  max_cot_steps: 2
  # v4 Adaptive Depth
  adaptive_depth: true
  depth_alpha: 0.5
  max_depth: 4

# Condition D: Full Betti (beta_0 + beta_1)
# F = geDIG - lambda * (gamma_1 * delta_beta_1 - gamma_0 * delta_beta_0)
condition_name: condition_d_betti_full

data_path: data/hotpotqa_distractor_dev.jsonl

adapter:
  structural_mode: betti_full
  gamma_0: 1.0
  gamma_1: 1.0
  lambda_weight: 1.0
  theta_ag: 0.4
  theta_dg: 0.0
  max_hops: 2
  top_k: 5
  max_expansions: 1
  expansion_seeds: 2
  tfidf_dim: 64
  q_link_top_k: 3
  entity_overlap_threshold: 0.3
  llm_model: gpt-4o-mini
  llm_temperature: 0.0
  llm_max_tokens: 256
  llm_retry_max: 3

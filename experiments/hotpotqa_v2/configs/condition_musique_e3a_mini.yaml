# MuSiQue baseline — E3A + GPT-4o-mini
# MuSiQue has 20 paragraphs (2-4 gold + distractors) — ideal for geDIG gauge
condition_name: condition_musique_e3a_mini

data_path: data/musique_dev.jsonl

adapter:
  structural_mode: betti_full
  gamma_0: 0.3
  gamma_1: 0.5
  lambda_weight: 1.0
  theta_ag: 0.4
  theta_dg: -0.5
  max_hops: 2
  top_k: 5
  max_expansions: 1
  expansion_seeds: 2
  tfidf_dim: 64
  q_link_top_k: 3
  entity_overlap_threshold: 0.3
  llm_model: gpt-4o-mini
  llm_temperature: 0.0
  llm_max_tokens: 256
  llm_retry_max: 3
  hybrid_mode: true
  max_cot_steps: 2
  two_edge_mode: true
  rerank_alpha: 0.5
  ctx_max_sent_distance: 6
  sim_alpha: 0.6
  sim_beta: 0.4
  sim_edge_threshold: 0.45

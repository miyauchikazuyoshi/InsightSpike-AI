# Condition C: beta_0 only
# structural_mode=betti_full, gamma_0=1.0, gamma_1=0
# F = geDIG - lambda * (0 - gamma_0 * delta_beta_0) = geDIG + lambda * gamma_0 * delta_beta_0
# Bridge facts that merge islands (delta_beta_0 = -1) get penalised less
condition_name: condition_c_beta0

data_path: data/hotpotqa_distractor_dev.jsonl

adapter:
  structural_mode: betti_full
  gamma_0: 1.0
  gamma_1: 0.0
  lambda_weight: 1.0
  theta_ag: 0.4
  theta_dg: 0.0
  max_hops: 2
  top_k: 5
  max_expansions: 1
  expansion_seeds: 2
  tfidf_dim: 64
  q_link_top_k: 3
  entity_overlap_threshold: 0.3
  llm_model: gpt-4o-mini
  llm_temperature: 0.0
  llm_max_tokens: 256
  llm_retry_max: 3

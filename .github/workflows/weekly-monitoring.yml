name: Weekly Monitoring

on:
  schedule:
    # Run every Sunday at 2 AM UTC
    - cron: '0 2 * * 0'
  workflow_dispatch:  # Allow manual triggers

jobs:
  gedig-health-check:
    runs-on: ubuntu-latest
    if: github.repository == 'miyauchikazuyoshi/InsightSpike-AI'
    
    steps:
    - uses: actions/checkout@v4
    
    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: "3.11"
    
    - name: Install dependencies (light)
      env:
        PIP_DISABLE_PIP_VERSION_CHECK: "1"
        PYTHONWARNINGS: "ignore"
      run: |
        python -m pip install --upgrade pip
        pip install -e . "numpy>=1.26.0,<3.0" "networkx>=3.1" "scikit-learn>=1.3" "pyyaml>=6.0"
    
    - name: geDIG Health Check
      env:
        PYTHONPATH: ${{ github.workspace }}/src
        INSIGHTSPIKE_LITE_MODE: "1"
        INSIGHTSPIKE_MIN_IMPORT: "1"
        PYTEST_DISABLE_PLUGIN_AUTOLOAD: "1"
      run: |
        echo "🔍 Running geDIG health checks..."

        # Test geDIG selector. A failing mode must fail the job — the whole
        # point of a monitoring run is a non-zero exit on breakage.
        python -c "
        import sys
        from insightspike.algorithms.gedig.selector import compute_gedig
        import networkx as nx

        # Create simple test graphs
        g1 = nx.Graph()
        g1.add_edge(1, 2)
        g2 = nx.Graph()
        g2.add_edges_from([(1, 2), (2, 3)])

        # Test all modes
        failures = []
        for mode in ['pure', 'full', 'ab']:
            try:
                result = compute_gedig(g1, g2, mode=mode)
                print(f'✅ geDIG {mode} mode: {result[\"gedig\"]:.3f}')
            except Exception as e:
                print(f'❌ geDIG {mode} mode failed: {e}')
                failures.append(mode)

        if failures:
            print(f'💥 geDIG health check FAILED for modes: {failures}')
            sys.exit(1)
        print('🎉 geDIG health check completed')
        "
    
    - name: Public API Health Check  
      env:
        PYTHONPATH: ${{ github.workspace }}/src
        INSIGHTSPIKE_LITE_MODE: "1"
        INSIGHTSPIKE_MIN_IMPORT: "1"
        PYTEST_DISABLE_PLUGIN_AUTOLOAD: "1"
      run: |
        echo "🔍 Testing public API..."
        python -c "
        from insightspike.public import create_agent, get_config_summary
        
        # Test agent creation
        agent = create_agent()
        print('✅ Agent creation successful')
        
        # Test config summary
        summary = get_config_summary()
        print(f'✅ Config summary: {len(summary)} keys')
        
        print('🎉 Public API health check completed')
        "

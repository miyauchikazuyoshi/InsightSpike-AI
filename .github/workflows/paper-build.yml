name: Paper Build

# Manual-only. PDFs are built locally and committed alongside the .tex source,
# so we don't need CI re-builds on every paper-related push. Trigger manually
# from the Actions tab when you want to verify the LaTeX still compiles.
#
# History: prior auto-trigger pointed at v5 .tex files which were renamed to
# v6, causing every docs/paper/** push to fail noisily. Rather than maintain
# a fragile (xelatex + Japanese) CI build for an artifact we already commit,
# we ship the PDF from the developer's machine and run this workflow only
# when explicitly requested.
#
# When a new paper version directory is added under docs/paper/, update the
# paths below (and in release.yml / release-paper.yml) in the same commit.
on:
  workflow_dispatch:

jobs:
  build:
    name: Build JA/EN PDFs
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Build JA PDF (v6.1)
        uses: xu-cheng/latex-action@v3
        with:
          root_file: geDIG_onegauge_improved_v6_1.tex
          working_directory: docs/paper/v6.1
          latexmk_use_xelatex: true

      - name: Build EN PDF (v6.1 arXiv)
        uses: xu-cheng/latex-action@v3
        with:
          root_file: arxiv_en/geDIG_onegauge_improved_v6_1_en.tex
          working_directory: docs/paper/v6.1
          latexmk_use_xelatex: true

      - name: Check LaTeX logs for refs/cites
        run: |
          bash scripts/check_latex_logs.sh \
            docs/paper/v6.1/geDIG_onegauge_improved_v6_1.log \
            docs/paper/v6.1/arxiv_en/geDIG_onegauge_improved_v6_1_en.log

      - name: Upload LaTeX logs (Artifacts)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: paper-logs
          path: |
            docs/paper/v6.1/*.log
            docs/paper/v6.1/arxiv_en/*.log

      - name: Upload PDFs (Artifacts)
        uses: actions/upload-artifact@v4
        with:
          name: paper-pdfs
          path: |
            docs/paper/v6.1/geDIG_onegauge_improved_v6_1.pdf
            docs/paper/v6.1/arxiv_en/geDIG_onegauge_improved_v6_1_en.pdf

name: Paper Build

# Manual-only. PDFs are built locally and committed alongside the .tex source,
# so we don't need CI re-builds on every paper-related push. Trigger manually
# from the Actions tab when you want to verify the LaTeX still compiles.
#
# History: prior auto-trigger pointed at v5 .tex files which were renamed to
# v6, causing every docs/paper/** push to fail noisily. Rather than maintain
# a fragile (xelatex + Japanese) CI build for an artifact we already commit,
# we ship the PDF from the developer's machine and run this workflow only
# when explicitly requested.
on:
  workflow_dispatch:

jobs:
  build:
    name: Build JA/EN PDFs
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Build JA PDF (v5)
        uses: xu-cheng/latex-action@v3
        with:
          root_file: geDIG_onegauge_improved_v5.tex
          working_directory: docs/paper
          latexmk_use_xelatex: true

      - name: Build EN PDF (v5 full)
        uses: xu-cheng/latex-action@v3
        with:
          root_file: arxiv_v5_en/geDIG_onegauge_improved_v5_full_en.tex
          working_directory: docs/paper
          latexmk_use_xelatex: true

      - name: Check LaTeX logs for refs/cites
        run: |
          bash scripts/check_latex_logs.sh \
            docs/paper/geDIG_onegauge_improved_v5.log \
            docs/paper/arxiv_v5_en/geDIG_onegauge_improved_v5_full_en.log

      - name: Upload LaTeX logs (Artifacts)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: paper-logs
          path: |
            docs/paper/*.log

      - name: Upload PDFs (Artifacts)
        uses: actions/upload-artifact@v4
        with:
          name: paper-pdfs
          path: |
            docs/paper/geDIG_onegauge_improved_v5.pdf
            docs/paper/arxiv_v5_en/geDIG_onegauge_improved_v5_full_en.pdf

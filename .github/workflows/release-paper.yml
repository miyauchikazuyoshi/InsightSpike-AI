name: Release (Paper PDFs)

# Attaches the committed paper PDFs to a draft release when a paper tag is
# pushed. PDFs are built locally and committed alongside the .tex source
# (see paper-build.yml for the rationale), so this workflow attaches rather
# than rebuilds — a CI LaTeX build here previously broke on every paper
# version rename (v4 -> v5 -> v6).
on:
  push:
    tags:
      - 'v*-paper'
      - 'paper-*'

jobs:
  attach_pdfs:
    name: Attach paper PDFs to draft Release
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          draft: true
          # Paths must exist in the tagged tree; keep in sync with docs/paper/<latest>/
          files: |
            docs/paper/v6.1/geDIG_onegauge_improved_v6_1.pdf
            docs/paper/v6.1/arxiv_en/geDIG_onegauge_improved_v6_1_en.pdf
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

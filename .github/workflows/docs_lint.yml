name: Docs Lint & Index Consistency
on:
  pull_request:
    paths:
      - 'docs/development/**.md'
      - 'scripts/build_plan_index.py'
      - 'scripts/doc_meta_update.py'
  push:
    branches: [ main ]
    paths:
      - 'docs/development/**.md'
      - 'scripts/build_plan_index.py'
      - 'scripts/doc_meta_update.py'

jobs:
  docs:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Run plan index build
        run: |
          python scripts/build_plan_index.py
      - name: Verify front matter presence & statuses
        run: |
          python - <<'PY'
          import pathlib

          root = pathlib.Path("docs/development")
          allowed = {
              "canonical",
              "proposal",
              "active",
              "completed",
              "deprecated",
              "archive",
              "research",
          }
          invalid = []

          for md in root.glob("*.md"):
              text = md.read_text(encoding="utf-8")
              if not text.startswith("---"):
                  invalid.append((str(md), "missing_front_matter"))
                  continue

              front_matter_end = text.find("\n---\n", 3)
              if front_matter_end == -1:
                  invalid.append((str(md), "unterminated_front_matter"))
                  continue

              front_matter = text[:front_matter_end].splitlines()[1:]
              status_lines = [
                  line for line in front_matter if line.startswith("status:")
              ]
              if not status_lines:
                  invalid.append((str(md), "missing_status"))
                  continue

              status = status_lines[0].split(":", 1)[1].strip()
              if status not in allowed:
                  invalid.append((str(md), f"bad_status:{status}"))

          index = root / "PLAN_INDEX.md"
          if index.exists():
              index_text = index.read_text(encoding="utf-8")
              if (
                  "<!-- AUTO-SECTION:BEGIN -->" not in index_text
                  or "<!-- AUTO-SECTION:END -->" not in index_text
              ):
                  invalid.append((str(index), "missing_auto_section"))

          if invalid:
              for filename, reason in invalid:
                  print(f"{filename}: {reason}")
              raise SystemExit(1)

          print("All docs passed basic front matter checks.")
          PY
      - name: Decision schedule report
        run: |
          python scripts/doc_issue_scheduler.py > decision_schedule.jsonl
          echo '--- decision schedule (top 20) ---'
          head -n 20 decision_schedule.jsonl || true
      - name: Upload schedule artifact
        uses: actions/upload-artifact@v4
        with:
          name: decision-schedule
          path: decision_schedule.jsonl

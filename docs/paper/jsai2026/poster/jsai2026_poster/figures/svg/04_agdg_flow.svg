<?xml version="1.0" encoding="UTF-8"?>
<svg width="100%" viewBox="0 0 680 275" xmlns="http://www.w3.org/2000/svg">
<defs>
<marker id="agarr" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M2 1L8 5L2 9" fill="none" stroke="context-stroke" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></marker>
</defs>
<text x="340" y="28" text-anchor="middle" font-size="16" font-weight="500">AG/DG 二段ゲート制御フロー</text>
<text x="300" y="72" text-anchor="middle" font-size="11" fill="#993C1D" font-weight="500">違和感 (ambiguity)</text>
<text x="435" y="72" text-anchor="middle" font-size="11" fill="#534AB7" font-weight="500">近道 (shortcut)</text>

<rect x="30" y="95" width="90" height="62" rx="8" fill="#F1EFE8" stroke="#888" stroke-width="0.5"/>
<text x="75" y="112" text-anchor="middle" dominant-baseline="central" font-size="14" font-weight="500" fill="#2C2C2A">observe</text>
<text x="75" y="129" text-anchor="middle" dominant-baseline="central" font-size="12" fill="#444">局所観測</text>

<line x1="120" y1="126" x2="145" y2="126" stroke="#666" stroke-width="1.5" marker-end="url(#agarr)"/>

<rect x="145" y="95" width="95" height="62" rx="8" fill="#F1EFE8" stroke="#888" stroke-width="0.5"/>
<text x="192" y="112" text-anchor="middle" dominant-baseline="central" font-size="14" font-weight="500" fill="#2C2C2A">candidate</text>
<text x="192" y="129" text-anchor="middle" dominant-baseline="central" font-size="12" fill="#444">候補生成</text>

<line x1="240" y1="126" x2="245" y2="126" stroke="#666" stroke-width="1.5" marker-end="url(#agarr)"/>

<rect x="247" y="95" width="105" height="62" rx="8" fill="#FAECE7" stroke="#993C1D" stroke-width="0.5"/>
<text x="300" y="112" text-anchor="middle" dominant-baseline="central" font-size="13" font-weight="500" fill="#4A1B0C">Attention Gate</text>
<text x="300" y="130" text-anchor="middle" dominant-baseline="central" font-size="11" fill="#712B13">g₀ &gt; θ_AG ?</text>

<text x="362" y="120" text-anchor="middle" dominant-baseline="central" font-size="11" fill="#0F6E56" font-weight="500">Yes</text>
<line x1="352" y1="126" x2="382" y2="126" stroke="#666" stroke-width="1.5" marker-end="url(#agarr)"/>

<rect x="382" y="95" width="105" height="62" rx="8" fill="#EEEDFE" stroke="#534AB7" stroke-width="0.5"/>
<text x="435" y="112" text-anchor="middle" dominant-baseline="central" font-size="13" font-weight="500" fill="#26215C">Decision Gate</text>
<text x="435" y="130" text-anchor="middle" dominant-baseline="central" font-size="11" fill="#3C3489">g_min &lt; θ_DG ?</text>

<text x="497" y="120" text-anchor="middle" dominant-baseline="central" font-size="11" fill="#0F6E56" font-weight="500">Yes</text>
<line x1="487" y1="126" x2="517" y2="126" stroke="#666" stroke-width="1.5" marker-end="url(#agarr)"/>

<rect x="517" y="95" width="100" height="62" rx="8" fill="#E1F5EE" stroke="#1D9E75" stroke-width="0.5"/>
<text x="567" y="112" text-anchor="middle" dominant-baseline="central" font-size="14" font-weight="500" fill="#04342C">commit</text>
<text x="567" y="129" text-anchor="middle" dominant-baseline="central" font-size="12" fill="#085041">エッジ確定</text>

<text x="312" y="168" text-anchor="start" font-size="11" fill="#0F6E56" font-weight="500">No</text>
<path d="M 300 157 L 300 195 L 567 195 L 567 157" stroke="#0F6E56" stroke-width="1.3" fill="none" marker-end="url(#agarr)"/>
<text x="420" y="210" text-anchor="middle" font-size="10" fill="#0F6E56" font-weight="500">局所で自己完結 → そのまま統合 (大多数のケース)</text>

<text x="447" y="168" text-anchor="start" font-size="11" fill="#A32D2D" font-weight="500">No</text>
<path d="M 435 157 L 435 235 L 75 235 L 75 157" stroke="#A32D2D" stroke-width="0.9" stroke-dasharray="4 3" fill="none" marker-end="url(#agarr)" opacity="0.8"/>
<text x="250" y="249" text-anchor="middle" font-size="10" fill="#A32D2D" opacity="0.85">近道なし → 候補棄却 / reject candidate</text>

<path d="M 567 157 L 567 179 L 75 179 L 75 157" stroke="#999" stroke-width="0.9" stroke-dasharray="4 3" fill="none" marker-end="url(#agarr)" opacity="0.7"/>
<text x="500" y="172" text-anchor="middle" font-size="10" fill="#666" opacity="0.85">次の観測へ / next step</text>
</svg>
